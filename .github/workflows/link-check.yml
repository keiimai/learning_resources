name: link-check
on:
  schedule:
    # 毎月1日 9:00（日本時間）
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 403・429 は自動アクセスの拒否・制限で、ブラウザでは開けるため正常として扱う
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept '200..=299,403,429'
            --user-agent 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15'
            'docs/**/*.md'
            README.md
          fail: true
          jobSummary: true
